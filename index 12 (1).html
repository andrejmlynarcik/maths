<style>
:root{color-scheme:light;--ink:#182b42;--blue:#164b85;--pale:#edf3fa;--border:#aab8c8}*{box-sizing:border-box}body{margin:0;font:18px/1.55 system-ui,Arial,sans-serif;color:var(--ink);background:#f5f7fb}header,main,footer{max-width:1100px;margin:auto;padding:1rem}header{background:var(--ink);color:white;max-width:none}header>div{max-width:1068px;margin:auto}h1{margin:.2rem 0;font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}nav,.controls,.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}button,select,input,textarea{font:inherit;border:1px solid var(--border);border-radius:.4rem;padding:.55rem}button{background:var(--blue);color:white;cursor:pointer}button.secondary{background:white;color:var(--blue)}button:disabled{opacity:.55;cursor:default}a{color:#154d87}header button{border-color:white}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #bc6200;outline-offset:3px}section,.card{background:white;padding:1.2rem;border:1px solid var(--border);border-radius:.7rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}.grid .card{margin:0}label{display:block;font-weight:600;margin:.6rem 0 .25rem}input,textarea{max-width:100%;width:100%;background:white;color:var(--ink)}input[type=checkbox]{width:auto}select{max-width:100%}.small{font-size:.9rem}.notice{border-left:5px solid var(--blue);padding:.8rem;background:var(--pale)}.feedback{border:2px solid var(--blue);padding:1rem;margin-top:1rem}.badge{display:inline-block;padding:.2rem .6rem;background:var(--pale);border-radius:.3rem;margin-right:.4rem}svg{display:block;width:100%;max-width:540px;height:auto;margin:1rem auto;color:#111}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--border);padding:.5rem;text-align:left}progress{width:100%;height:1.1rem}.timer{font-variant-numeric:tabular-nums;font-weight:bold}#printArea{display:none}details{margin:.8rem 0}summary{cursor:pointer;font-weight:bold}footer{font-size:.85rem}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){body{font-size:17px}main{padding:.6rem}section{padding:.8rem}h1{font-size:1.6rem}}@media print{body{background:white;color:black;font:12pt/1.4 Arial,sans-serif}header,main,footer{display:none!important}#printArea{display:block}.paperq{break-inside:avoid;border-bottom:1px solid #999;padding:12pt 0}.space{height:70pt}svg{max-width:330px}h1,h2{color:black}a{color:black}button{display:none}}

<body>
<header><div><h1>Year 8 Maths Studio</h1><p>Learn a method. Try it. Explain it. Build confidence.</p><nav aria-label="Main navigation"><button data-nav="home">Home</button><button data-nav="learn">Learn and practise</button><button data-nav="mocks">Mock assessments</button><button data-nav="alignment">Curriculum alignment</button></nav></div></header>
<main id="app" tabindex="-1"></main><div id="printArea"></div>
<footer>No login, tracking or network requests. Progress stays in this browser where local storage is available. Never enter personal information. This is a revision tool, not an official examination.</footer>
<script>
'use strict';
const names=['Estimation and rounding','Decimal calculations','Solving linear equations','Gradient of a straight line','Angles in polygons','Sequences and the nth term','Angles in parallel lines'];
const levels=['Foundation','Core','Challenge'];
const lessons=[
['Rounding replaces a number with a nearby value at a chosen precision. For an estimate, round each input as instructed, then calculate. An estimate checks size, not exact accuracy. Bounds are an optional extension.','Decimal place: a position after the decimal point. Significant figure: a meaningful digit counted from the first non-zero digit. Estimate: an approximate calculation. Bound: an endpoint of a rounding interval.',['Round 0.04786 to 2 significant figures.','The first significant digit is 4; the second is 7.','The next digit is 8, so increase 7 to 8.','The rounded value is 0.048.'],'Do not count leading zeros as significant figures. Keep placeholder zeros. Round inputs before estimating, not the final exact answer.'],
['Align decimal points for addition and subtraction. For multiplication, multiply as whole numbers and restore the combined decimal places. For division, multiply both numbers by the same power of ten to make the divisor a whole number. With a calculator, enter brackets carefully and estimate first.','Place value: the value of a digit’s position. Divisor: the number you divide by. Product: a multiplication result. Difference: a subtraction result.',['Calculate 3.6 ÷ 0.8 without a calculator.','Multiply both numbers by 10: 36 ÷ 8.','36 ÷ 8 = 4.5.','Check: 4.5 × 0.8 = 3.6.'],'Do not align the last digits instead of decimal points. Dividing by a number smaller than 1 can increase the answer. Write money to two decimal places.'],
['An equation says two expressions are equal. Keep it balanced by doing the same operation to both sides. Undo addition or subtraction before multiplication or division. Expand brackets when useful. Check by substituting your solution into both sides.','Unknown: a value to find. Inverse: an operation that undoes another. Coefficient: the multiplier of an unknown. Substitute: replace a letter with a value.',['Solve 3x + 5 = 20.','Subtract 5 from both sides: 3x = 15.','Divide both sides by 3: x = 5.','Check: 3 × 5 + 5 = 20.'],'Do not change just one side. Multiply every term inside a bracket. When collecting unknowns, subtract the same term from both sides.'],
['Gradient measures how much y changes for each unit increase in x. Gradient = change in y ÷ change in x. Use the same order for both coordinate differences. Rising lines have positive gradient; falling lines negative; horizontal lines zero; vertical lines undefined because division by zero is impossible.','Gradient: rate of change. Coordinate: an ordered pair (x,y). Rise: change in y. Run: change in x. Undefined: no numerical gradient exists.',['Find the gradient through (1,2) and (4,8).','Change in y = 8 − 2 = 6.','Change in x = 4 − 1 = 3.','Gradient = 6 ÷ 3 = 2.'],'Do not use change in x divided by change in y. Check axis units: metres per kilometre differs from metres per metre. A vertical line does not have gradient zero.'],
['A triangle’s interior angles sum to 180° and a quadrilateral’s to 360°. An n-sided polygon can be split into n − 2 triangles, so its interior sum is (n − 2) × 180°. A regular polygon has equal sides and angles. Its exterior angles sum to 360°; each interior and adjacent exterior angle sum to 180°.','Polygon: a closed straight-sided shape. Interior: inside. Exterior: the turn outside. Regular: all sides and all angles equal.',['Find each interior angle of a regular hexagon.','Six sides give (6 − 2) × 180° = 720°.','Divide by 6: 720° ÷ 6 = 120°.','Check: exterior angle = 60°; six turns total 360°.'],'Do not use 360° for every interior sum. Divide by the number of sides only for a regular polygon. Interior and exterior angles are not generally equal.'],
['An arithmetic sequence has a constant difference d. Its nth term is dn + c, where c is the first term minus d and n starts at 1. To test membership, set the rule equal to the number and check whether n is a positive whole number.','Term: a sequence entry. Common difference: the fixed step. Position n: a positive whole-number index. nth term: a rule giving any term.',['Find the nth term of 7,11,15,19,…','The common difference is 4, so start with 4n.','At n = 1, 4n gives 4; add 3 to get 7.','Rule: 4n + 3. Check n = 1,2,3 gives 7,11,15.'],'Do not confuse the term value with its position. The difference alone is not the full rule. A negative or fractional position does not count as membership.'],
['For parallel lines cut by a transversal, corresponding angles are equal and alternate angles are equal. Co-interior angles sum to 180°. Vertically opposite angles are equal, even without parallel lines. Angles on a straight line sum to 180°. Give a reason for each step.','Parallel: lines that never meet. Transversal: a line crossing others. Corresponding: matching positions. Alternate: opposite sides inside the parallels. Co-interior: same side inside the parallels.',['A transversal makes an interior angle of 68°. Find the co-interior angle.','Co-interior angles between parallel lines sum to 180°.','Calculate 180° − 68° = 112°.','Check: 68° + 112° = 180°.'],'Do not assume every pair is equal. First identify the positions and parallel markings. Never measure a diagram unless asked.']
];
const Q={},K={},practice=names.map(()=>[]),mockSets={};
const clean=n=>Number(Number(n).toPrecision(12));
const fmt=n=>String(clean(n));
const round=(x,p)=>clean(Math.round(x*10**p+1e-9)/10**p);
const sf=(x,p)=>x===0?0:round(x,p-1-Math.floor(Math.log10(Math.abs(x))));
function graph(x1,y1,x2,y2){
 const lo=-5,hi=10,S=22,X=x=>50+(x-lo)*S,Y=y=>365-(y-lo)*S;let g='';
 for(let v=lo;v<=hi;v++){g+=`<path d="M${X(v)} 35V365 M50 ${Y(v)}H380" stroke="#ccc"/><text x="${X(v)}" y="${Y(0)+18}" text-anchor="middle" font-size="10">${v}</text><text x="${X(0)-12}" y="${Y(v)+4}" text-anchor="end" font-size="10">${v}</text>`;}
 let dx=x2-x1,dy=y2-y1,points=[];for(let t=-30;t<=30;t+=.1){let x=x1+t*dx,y=y1+t*dy;if(x>=lo&&x<=hi&&y>=lo&&y<=hi)points.push(`${X(x)},${Y(y)}`);}
 return `<svg viewBox="0 0 430 405" role="img" aria-label="Coordinate graph, both axes from minus 5 to 10 in steps of 1. Straight line through (${x1},${y1}) and (${x2},${y2})."><defs><marker id="axisArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="black"/></marker></defs>${g}<path d="M50 ${Y(0)}H395 M${X(0)} 365V20" stroke="black" stroke-width="2" marker-end="url(#axisArrow)"/><text x="400" y="${Y(0)+5}">x</text><text x="${X(0)+8}" y="20">y</text><polyline points="${points.join(' ')}" fill="none" stroke="black" stroke-width="3"/>${[[x1,y1],[x2,y2]].map(([x,y])=>`<circle cx="${X(x)}" cy="${Y(y)}" r="4"/><text x="${X(x)+7}" y="${Y(y)-8}" font-size="13">(${x},${y})</text>`).join('')}<text x="50" y="398" font-size="12">Not necessarily drawn to scale; use coordinates.</text></svg>`;
}
function parallelDiagram(a){return `<svg viewBox="0 0 480 290" role="img" aria-label="Parallel horizontal lines crossed by a rising transversal. At upper crossing: A upper right, B upper left, C lower left, D lower right. At lower crossing: E upper right, F upper left, G lower left, H lower right. A is ${a} degrees."><path d="M30 80H450 M30 210H450 M120 270L350 10" fill="none" stroke="black" stroke-width="3"/><path d="M65 73L77 80L65 87 M65 203L77 210L65 217" fill="none" stroke="black" stroke-width="2"/><path d="M310 80A25 25 0 0 0 301 61 M195 210A25 25 0 0 0 186 191" fill="none" stroke="black"/><g font-size="17"><text x="317" y="62">A=${a}°</text><text x="249" y="61">B</text><text x="250" y="110">C</text><text x="307" y="110">D</text><text x="201" y="191">E</text><text x="135" y="191">F</text><text x="135" y="241">G</text><text x="201" y="241">H</text></g><text x="25" y="286" font-size="13">Not necessarily drawn to scale.</text></svg>`;}
function polygonDiagram(n){let pts=[];for(let i=0;i<n;i++){let a=2*Math.PI*i/n-Math.PI/2;pts.push([180+105*Math.cos(a),130+105*Math.sin(a)]);}return `<svg viewBox="0 0 360 280" role="img" aria-label="${n}-sided polygon; use stated angles, not measurement."><polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="white" stroke="black" stroke-width="3"/>${pts.map((p,i)=>`<text x="${180+(p[0]-180)*.77}" y="${130+(p[1]-130)*.77}" text-anchor="middle" font-size="14">V${i+1}</text>`).join('')}<text x="15" y="270" font-size="13">Not necessarily drawn to scale.</text></svg>`;}
function seatsDiagram(d,c){let s='';for(let n=1;n<=3;n++){s+=`<text x="10" y="${n*50}" font-size="14">Pattern ${n}</text>`;for(let j=0;j<d*n+c;j++)s+=`<rect x="${100+j*18}" y="${n*50-15}" width="13" height="13" fill="white" stroke="black"/>`;}return `<svg viewBox="0 0 450 190" role="img" aria-label="Seat patterns with ${d+c}, ${2*d+c} and ${3*d+c} seats. Each square is one seat.">${s}<text x="10" y="182" font-size="12">Each square represents one seat.</text></svg>`;}
// Descriptors contain question inputs, not stored expected answers.
// Expected answers and mark schemes are held only in the separate K map.
function build(id,t,l,kind,v,marks=1,diagnostic=false){
 let text='',answer,steps=[],checks=[],diagram='',alt='Any mathematically valid method is acceptable.',hint=lessons[t][3];
 const cp=(label,value,reason)=>checks.push({label,value,reason});
 const [a,b,c,d]=v;
 if(t===0){
  if(kind==='dp'||kind==='sf'){let f=kind==='dp'?round:sf;answer=f(a,b);text=`${c||'Round'} ${a} to ${b} ${kind==='dp'?'decimal place(s)':'significant figure(s)'}.`;steps=[`Locate the ${b}${kind==='dp'?'th decimal place':'th significant digit, starting at the first non-zero digit'}.`,`Inspect the next digit: 5 or more rounds up; less than 5 stays.`,`Keep place value: ${kind==='dp'?answer.toFixed(b):answer.toPrecision(b)}.`];let pos=kind==='dp'?b:b-1-Math.floor(Math.log10(Math.abs(a)));let scaled=Math.floor(a*10**(pos+1)+1e-7);cp('Digit immediately after the rounding position',Math.abs(scaled)%10,'Inspect the next digit');cp('Scaling factor to the rounding position',10**pos,'Locate rounding position');}
  if(kind==='estimate'){let ra=sf(a,1),rb=sf(b,1);answer=c==='divide'?ra/rb:ra*rb;text=`${d} Estimate ${a} ${c==='divide'?'÷':'×'} ${b} by rounding EACH number to 1 significant figure. Give the estimated result.`;steps=[`${a} rounds to ${ra}; ${b} rounds to ${rb}.`,`Calculate ${ra} ${c==='divide'?'÷':'×'} ${rb} = ${fmt(answer)}.`,`This is an estimate, not the exact result.`];cp('First rounded input',ra,'First input rounded to 1 significant figure');cp('Second rounded input',rb,'Second input rounded to 1 significant figure');}
  if(kind==='bill'){answer=v.reduce((s,x)=>s+Math.round(x),0);text=`A supermarket bill has items costing £${a}, £${b} and £${c}. Round EACH price to the nearest pound and estimate the total in pounds.`;steps=[`Rounded prices: £${Math.round(a)}, £${Math.round(b)}, £${Math.round(c)}.`,`Add these rounded prices: £${answer}.`];cp('First rounded price',Math.round(a),'Round first price');cp('Second rounded price',Math.round(b),'Round second price');cp('Third rounded price',Math.round(c),'Round third price');}
  if(kind==='reasonable'){answer='no';text=`A pupil says ${a} × ${b} = ${c}. Is this reasonable? Enter yes or no. Use a 1-significant-figure estimate in your working.`;let ra=sf(a,1),rb=sf(b,1);steps=[`Round to ${ra} × ${rb}.`,`Estimate ${ra*rb}.`,`No: ${c} is far from ${ra*rb}; check the decimal point.`];cp('First rounded input',ra,'Round first input');cp('Second rounded input',rb,'Round second input');cp('Estimated product',ra*rb,'Multiply rounded inputs');}
  if(kind==='bounds'){let half=.5*10**(-b);answer=[clean(a-half),clean(a+half)];text=`Optional bounds challenge: a bottle holds ${a} litres when rounded to ${b} decimal place(s). Give lower bound, upper bound, separated by a comma. The upper bound is excluded.`;steps=[`The rounding step is ${10**(-b)}; half is ${half}.`,`Lower bound = ${a} − ${half} = ${answer[0]}.`,`Upper bound = ${a} + ${half} = ${answer[1]}, excluded.`];cp('Half of rounding step',half,'Find half the rounding unit');}
 }
 if(t===1){
  if(kind==='reason'){answer='no';text=`A pupil says dividing ${a} by ${b} must make it smaller. Is the pupil correct? Enter yes or no. Explain using the calculation on paper.`;steps=[`Scale both numbers equally: ${a*10} / ${b*10}.`,`The quotient is ${fmt(a/b)}, which is greater than ${a}.`,`No: division by a positive number below 1 makes a positive number larger.`];cp('Scaled dividend',a*10,'Scale both numbers');cp('Scaled divisor',b*10,'Scale both numbers');cp('Calculated quotient',a/b,'Compare quotient with dividend');}

  if(kind==='add'||kind==='sub'){answer=kind==='add'?a+b:a-b;text=`${c||'Calculate'} ${a} ${kind==='add'?'+':'−'} ${b}.`;steps=[`Align the decimal points and pad with zeros if needed.`,`In hundredths: ${clean(a*100)} ${kind==='add'?'+':'-'} ${clean(b*100)} = ${clean(answer*100)}. Divide by 100 to restore the decimal.`,`Result: ${fmt(answer)}. Check using the inverse operation.`];cp('First value in hundredths',clean(a*100),'Convert first value to hundredths');cp('Second value in hundredths',clean(b*100),'Convert second value to hundredths');cp('Result in hundredths',clean(answer*100),'Calculate in hundredths');}
  if(kind==='mul'){answer=a*b;text=`${c||'Calculate'} ${a} × ${b}.`;let p=(String(a).split('.')[1]||'').length,q=(String(b).split('.')[1]||'').length;steps=[`Multiply whole numbers: ${a*10**p} × ${b*10**q} = ${clean(a*b*10**(p+q))}.`,`Restore ${p+q} decimal places: ${fmt(answer)}.`,`Estimate first; use a calculator to check if permitted.`];cp('Whole-number product',clean(a*b*10**(p+q)),'Multiply ignoring decimal points');cp('Total decimal places',p+q,'Count decimal places');cp('Power-of-ten divisor',10**(p+q),'Restore place value');}
  if(kind==='div'){answer=a/b;text=`${c||'Calculate'} ${a} ÷ ${b}.`;let p=(String(b).split('.')[1]||'').length;steps=[`Multiply BOTH numbers by ${10**p}: ${clean(a*10**p)} ÷ ${clean(b*10**p)}.`,`Divide to get ${fmt(answer)}.`,`Check ${fmt(answer)} × ${b} = ${a}.`];cp('Scaled dividend',clean(a*10**p),'Scale dividend');cp('Scaled divisor',clean(b*10**p),'Scale divisor');cp('Scaling factor',10**p,'Use same scaling factor');}
 }
 if(t===2){
  if(kind==='eq'){answer=(d-b)/(a-c);text=`Solve ${a}x ${b<0?'−':'+'} ${Math.abs(b)} = ${c?c+'x + ':''}${d}. Give x.`;steps=[`Subtract ${c}x from both sides: ${a-c}x + ${b} = ${d}.`,`Subtract ${b}: ${a-c}x = ${d-b}.`,`Divide by ${a-c}: x = ${fmt(answer)}.`,`Check: both sides equal ${fmt(a*answer+b)}.`];cp('Coefficient after collecting x terms',a-c,'Subtract the same x term from both sides');cp('Constant after moving constants',d-b,'Subtract the same constant');cp('Value of each side after substitution',clean(a*answer+b),'Check by substitution');}
  if(kind==='bracket'){answer=d/a-b;text=`Solve ${a}(x + ${b}) = ${d}. Give x.`;steps=[`Divide both sides by ${a}: x + ${b} = ${fmt(d/a)}.`,`Subtract ${b}: x = ${fmt(answer)}.`,`Check: ${a}(${fmt(answer)} + ${b}) = ${d}.`];cp('Expanded coefficient of x',a,'Distribute multiplier');cp('Expanded constant',a*b,'Multiply every term');cp('Right side after subtracting expanded constant',d-a*b,'Balance equation');alt='Divide first, or expand brackets and then solve.';}
  if(kind==='context'){answer=(d-b)/a;text=`${c} The total is £${d}. Write and solve ${a}x + ${b} = ${d}, where x is the price in pounds. Give x.`;steps=[`Subtract the fixed £${b}: ${a}x = ${d-b}.`,`Divide by ${a}: x = £${fmt(answer)}.`,`Check ${a} × ${fmt(answer)} + ${b} = ${d}.`];cp('Amount after removing fixed charge',d-b,'Undo addition');cp('Number of equal-priced items',a,'Identify coefficient');cp('Checked total',d,'Substitute solution');}
  if(kind==='check'){answer=a*b+c===d?'yes':'no';text=`Does x = ${b} solve ${a}x + ${c} = ${d}? Enter yes or no.`;steps=[`Substitute: ${a} × ${b} + ${c} = ${a*b+c}.`,`Compare with ${d}: ${answer}.`];cp('Value of left side',a*b+c,'Substitute into expression');}
 }
 if(t===3){
  if(kind==='type'){answer=a;text=`${b} State the gradient type: positive, negative, zero or undefined.`;steps=[`${c}`,`The gradient is ${a}.`];cp('Gradient type',a,'Identify direction');}
  if(kind==='coords'||kind==='graph'){let dx=c-a,dy=d-b;answer=dx===0?'undefined':dy/dx;text=`Find the gradient ${kind==='graph'?'of the line on the graph':'through'} (${a},${b}) and (${c},${d}).`;if(kind==='graph')diagram=graph(a,b,c,d);steps=[`Change in y = ${d} − (${b}) = ${dy}.`,`Change in x = ${c} − (${a}) = ${dx}.`,dx===0?'Division by zero is impossible: gradient undefined.':`Gradient = ${dy} ÷ ${dx} = ${fmt(answer)}.`];cp('Change in y',dy,'Subtract y coordinates in order');cp('Change in x',dx,'Subtract x coordinates in same order');cp('y at first labelled point',b,'Read coordinate');}
  if(kind==='route'){answer=(d-b)/(c-a);text=`On a ${v[4]||'walking'} route, horizontal distance is x kilometres and height is y metres. A straight section goes from (${a},${b}) to (${c},${d}). Find the signed height change per kilometre (negative means descending), in m/km.`;steps=[`Height change = ${d-b} m.`,`Distance change = ${c-a} km.`,`Rate = ${d-b} ÷ ${c-a} = ${fmt(answer)} m/km.`,`This is height change per kilometre, not an angle.`];cp('Height change in metres',d-b,'Subtract heights');cp('Distance change in kilometres',c-a,'Subtract distances');cp('Distance change in metres',(c-a)*1000,'Convert kilometres to metres');}
 }
 if(t===4){
  if(kind==='missing'){let given=v.slice(1);let sum=(given.length+1-2)*180;answer=sum-given.reduce((s,x)=>s+x,0);text=`${a} has interior angles ${given.join('°, ')}° and one missing angle. Find the missing angle in degrees.`;steps=[`${given.length+1} sides: sum = (${given.length+1} − 2) × 180° = ${sum}°.`,`Known angles total ${sum-answer}°.`,`Missing angle = ${sum}° − ${sum-answer}° = ${answer}°.`];diagram=polygonDiagram(given.length+1);cp('Total interior angle sum',sum,'Use polygon angle sum');cp('Sum of known angles',sum-answer,'Add given angles');cp('Number of triangles in polygon',given.length-1,'Use n minus 2');}
  if(kind==='sum'){answer=(a-2)*180;text=`A ${b||'polygon'} has ${a} sides. Find its interior angle sum in degrees.`;steps=[`Split into ${a-2} triangles from one vertex.`,`Sum = (${a} − 2) × 180° = ${answer}°.`];diagram=polygonDiagram(a);cp('Number of triangles',a-2,'Use n minus 2');cp('Angle sum of one triangle',180,'Triangle sum');cp('Number of sides',a,'Read side count');}
  if(kind==='regular'){let sum=(a-2)*180;answer=b==='exterior'?360/a:sum/a;text=`A regular ${a}-sided ${c||'polygon'} has equal angles. Find each ${b} angle in degrees.`;steps=[`Interior sum = (${a} − 2) × 180° = ${sum}°.`,`Each interior angle = ${sum} ÷ ${a} = ${fmt(sum/a)}°.`,`Each exterior angle = 360° ÷ ${a} = ${fmt(360/a)}°; adjacent angles sum to 180°.`];diagram=polygonDiagram(a);cp('Interior angle sum',sum,'Polygon sum');cp('Full exterior turn',360,'Exterior angles sum to 360');cp('Number of equal angles',a,'Regular polygon');}
  if(kind==='sides'){answer=360/a;text=`A regular ${b||'tile'} has an exterior angle of ${a}°. How many sides does it have?`;steps=[`Exterior angles make a full turn of 360°.`,`Number of sides = 360 ÷ ${a} = ${answer}.`];cp('Full turn in degrees',360,'Exterior sum');cp('Interior angle',180-a,'Adjacent angles sum to 180');cp('Exterior angle',a,'Use given turn');}
  if(kind==='angleeq'){answer=(180-c)/(a+b);text=`A triangular ${d||'sign'} has angles ${a}x°, ${b}x° and ${c}°. Find x.`;steps=[`Triangle sum: ${a}x + ${b}x + ${c} = 180.`,`Collect: ${a+b}x = ${180-c}.`,`Divide: x = ${fmt(answer)}.`,`Check angles ${fmt(a*answer)}, ${fmt(b*answer)}, ${c} sum to 180°.`];diagram=polygonDiagram(3);cp('Combined coefficient of x',a+b,'Collect like terms');cp('Angle total left after fixed angle',180-c,'Subtract fixed angle');cp('Triangle angle sum',180,'Use angle sum');}
 }
 if(t===5){
  let first=a+b;
  if(kind==='next'){answer=first+3*a;text=`Continue the arithmetic sequence ${first}, ${first+a}, ${first+2*a}, … Give the next term.`;steps=[`Difference = ${a}.`,`Add ${a} to ${first+2*a}: ${answer}.`];cp('Common difference',a,'Subtract adjacent terms');}

function capture(){let s=state.session;if(!s||s.ended)return;let id=s.ids[s.index],a=document.getElementById('answer');if(a){s.responses[id]={answer:a.value,method:Q[id].fields.map((_,i)=>document.getElementById('method'+i).value)};save();}}
function question(){page='question';clearInterval(timerHandle);let s=state.session;if(!s)return home();if(s.ended)return results();if(s.deadline&&Date.now()>=s.deadline)return finish(true);let id=s.ids[s.index],q=Q[id],r=s.responses[id]||{answer:'',method:[]};show(`<section><h2>${s.mode==='mock'?'Mock '+s.letter:'Practice'}: ${names[q.t]}</h2><p><span class="badge">${levels[q.l]}</span><span class="badge">${q.marks} mark${q.marks===1?'':'s'}</span><span class="badge">${s.mode==='mock'?(q.calculator?'Calculator permitted':'Non-calculator'):'Non-calculator first; calculator check allowed'}</span></p><p>Question ${s.index+1} of ${s.ids.length} <span id="timer" class="timer" role="timer"></span></p><progress value="${s.index+1}" max="${s.ids.length}" aria-label="Question position"></progress><p>${q.text}</p>${q.diagram}<form id="answerForm">${q.fields.map((f,i)=>`<label for="method${i}">Working checkpoint ${i+1}: ${f.label} (${f.mark} method mark)</label><input id="method${i}" autocomplete="off" value="${esc((r.method||[])[i]||'')}">`).join('')}<label for="answer">Final answer (${s.mode==='mock'?'1 mark':'enter your response'})</label><input id="answer" autocomplete="off" value="${esc(r.answer)}" aria-describedby="inputHelp"><p id="inputHelp" class="small">Numbers, fractions and equivalent nth-term rules are accepted. For named relationships, use the requested words. Do not enter personal information.</p><div class="actions"><button type="submit">${s.mode==='mock'?'Save answer':'Submit answer'}</button><button type="button" id="review" class="secondary" aria-pressed="${!!s.review[id]}">${s.review[id]?'Marked for review ✓':'Mark for review'}</button></div></form><div id="feedback" aria-live="polite"></div><div class="actions"><button id="prev" ${s.index===0?'disabled':''}>Previous</button><button id="next" ${s.index===s.ids.length-1?'disabled':''}>Next</button><button id="end" class="secondary">${s.mode==='mock'?'End test':'Finish practice'}</button></div><details><summary>Jump to a question</summary><div class="actions">${s.ids.map((x,i)=>`<button class="secondary jump" data-index="${i}" aria-label="Question ${i+1}${s.review[x]?', marked for review':''}">${i+1}${s.review[x]?' ★':''}${s.submitted[x]?' ✓':''}</button>`).join('')}</div></details><p class="small">✓ means saved/submitted, not necessarily correct. ★ means marked for review.</p></section>`);
 document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();capture();s.submitted[id]=true;if(s.mode==='practice'){state.history[id]=s.responses[id];feedback(id);}else document.getElementById('feedback').innerHTML='<p>Answer saved. Feedback appears when the test ends.</p>';save();};
 document.getElementById('answerForm').oninput=()=>{if(s.mode==='practice'&&s.submitted[id]){delete s.submitted[id];document.getElementById('feedback').innerHTML='';}capture();};
 document.getElementById('review').onclick=()=>{capture();s.review[id]=!s.review[id];save();question();};
 document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('end').onclick=()=>finish(false);document.querySelectorAll('.jump').forEach(b=>b.onclick=()=>{capture();s.index=Number(b.dataset.index);save();question();});if(s.mode==='practice'&&s.submitted[id])feedback(id);
 if(s.deadline){tick();timerHandle=setInterval(tick,1000);}
}
function move(d){capture();state.session.index+=d;save();question();}
function tick(){let s=state.session;if(!s||s.ended){clearInterval(timerHandle);return;}let sec=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));let el=document.getElementById('timer');if(el)el.textContent=` | ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} remaining`;if(!sec)finish(true);}
function solution(id){let k=K[id];return `<p><strong>Correct answer: ${esc(ansText(k.answer))}</strong></p><p>${k.explanation}</p><ol>${k.steps.map(x=>`<li>${x}</li>`).join('')}</ol><p><strong>Alternative methods:</strong> ${k.alt}</p>`;}
function feedback(id){let correct=matches(state.session.responses[id].answer,K[id].answer);document.getElementById('feedback').innerHTML=`<div class="feedback"><h3>${correct?'Correct ✓':'Not yet correct: let’s build the method'}</h3>${solution(id)}<p><strong>Next mathematical step:</strong> ${K[id].steps[0]}</p>${correct?'<p>Now explain why the method works, then try the next question.</p>':`<p><strong>Helpful hint:</strong> ${K[id].hint}</p><p>Try the question again using the first step above.</p>`}</div>`;}
function finish(expired){let s=state.session;if(!s||s.ended)return;capture();let blanks=s.ids.filter(id=>!(s.responses[id]?.answer||'').trim()).length,flags=s.ids.filter(id=>s.review[id]).length;if(!expired&&!confirm(`Finish now? ${blanks} final answer(s) are blank and ${flags} question(s) are marked for review. Answers will be revealed.`))return;s.ended=true;s.expired=expired;s.ids.forEach(id=>{if(s.mode==='mock'||s.submitted[id])state.history[id]=s.responses[id]||{answer:'',method:[]};});clearInterval(timerHandle);save();results();}
function results(){page='results';let s=state.session;if(!s||!s.ended)return home();let res=s.responses,ids=s.ids,total=ids.reduce((a,id)=>a+Q[id].marks,0),got=ids.reduce((a,id)=>a+score(id,res[id]),0),p=100*got/total;show(`<section><h2>Results dashboard</h2>${s.expired?'<p class="notice">Time expired; saved responses were submitted.</p>':''}<p><strong>${got}/${total} marks (${p.toFixed(1)}%)</strong></p><p>${band(p)}. These are application feedback bands, not official national grades.</p><p>${p>=85?'You have a strong base. Explain alternative methods and try more multi-step challenges.':p>=70?'Most methods are secure. Focus on the topics with the lowest percentages and check each final answer.':p>=50?'You are building useful skills. Revisit a model, complete the diagnostic checks, then practise one topic at a time.':'Start with one modelled example and four Foundation questions. Small, regular steps will help you build confidence.'}</p>${topicTable(ids,res)}<p class="notice">Automated marks are for the final answer and the explicitly requested checkpoints. Free-form paper working is not automatically assessed. If you used another valid method, compare it with the full scheme; a teacher can award equivalent method marks on the printed paper.</p><div class="actions"><button id="retry">Retry incorrect questions</button><button id="restart">Restart this session</button><button id="printQ" class="secondary">Print blank paper</button><button id="printK" class="secondary">Print answers and mark scheme</button></div><h3>Worked-solution review and full mark scheme</h3>${ids.map((id,i)=>{let q=Q[id],k=K[id],r=res[id]||{answer:'',method:[]};return `<details><summary>Question ${i+1}: ${names[q.t]} (${score(id,r)}/${q.marks})</summary><p>${q.text}</p>${q.diagram}<p>Your final answer: ${esc(r.answer||'(blank)')}</p>${q.fields.map((f,j)=>`<p>Checkpoint ${j+1}: ${f.label}. Your value: ${esc((r.method||[])[j]||'(blank)')}. Expected: ${esc(ansText(k.checks[j].value))}. ${matches((r.method||[])[j],k.checks[j].value)?'Awarded':'Not awarded'}: 1 method mark. ${k.checks[j].reason}.</p>`).join('')}<p>Final-answer mark: ${matches(r.answer,k.answer)?'1':'0'}/1. No method mark depends on the final-answer mark.</p>${solution(id)}</details>`;}).join('')}</section>`);document.getElementById('retry').onclick=()=>retry(ids,res);document.getElementById('restart').onclick=()=>{if(confirm('Restart with blank responses? Previous submitted answers remain on the dashboard.')){let old=s;state.session=null;start(old.ids,old.mode,old.letter,!!old.deadline);}};document.getElementById('printQ').onclick=()=>printPaper(ids,false,s.letter);document.getElementById('printK').onclick=()=>printPaper(ids,true,s.letter);}
function retry(ids,res){let wrong=ids.filter(id=>score(id,res[id])<Q[id].marks);if(!wrong.length){alert('No incorrect questions in this selection. Try a higher difficulty.');return;}start(wrong,'practice');}
function printPaper(ids,key,letter){if(key&&(!state.session?.ended||ids!==state.session.ids)){alert('End the session before opening its answers.');return;}let total=ids.reduce((s,id)=>s+Q[id].marks,0);document.getElementById('printArea').innerHTML=`<h1>Year 8 Maths Studio: ${letter?'Mock '+letter:'Practice'} ${key?'answers and mark scheme':'paper'}</h1><p>${total} marks. ${letter?configs[letter].minutes+' minutes.':''} Original questions; not an official examination.</p><p>${key?'Award each listed checkpoint independently, even if the final answer is incorrect. Equivalent valid methods may earn the corresponding method marks.':'Answer all questions. Show working. Use a calculator only where permitted. Diagrams are not necessarily drawn to scale.'}</p>${ids.map((id,i)=>{let q=Q[id],k=K[id];return `<div class="paperq"><h2>Question ${i+1} (${q.marks} marks)</h2><p>${names[q.t]} · ${levels[q.l]} · ${q.calculator?'Calculator permitted':'Non-calculator'}</p><p>${q.text}</p>${q.diagram}${key?`${q.fields.map((f,j)=>`<p>M${j+1}: ${f.label}: ${esc(ansText(k.checks[j].value))} (1 method mark). ${k.checks[j].reason}.</p>`).join('')}<p>A1: correct final answer (1 mark).</p>${solution(id)}`:`${q.fields.map(f=>`<p>${f.label} (1 mark): ____________________</p>`).join('')}<p>Final answer (1 mark): ____________________</p><div class="space">Working:</div>`}</div>`;}).join('')}`;window.print();}
function alignment(){page='alignment';show(`<section><h2>Curriculum alignment</h2><p>This focused revision application covers Number, Algebra, and Geometry and measures, with fluency, reasoning and problem-solving throughout. It is not the complete Year 8 or Key Stage 3 curriculum.</p><ul><li>Number: place value, decimal arithmetic, rounding, significant figures, estimation and checking reasonableness. Bounds are an optional extension.</li><li>Algebra: linear equations, brackets, substitution, arithmetic sequences and nth terms.</li><li>Graphs: coordinates, straight-line gradient and rates of change.</li><li>Geometry and measures: triangle and quadrilateral angles, polygon sums, regular polygons and parallel-line angle relationships.</li></ul><p>The structure draws on the DfE statutory KS3 programme, the DfE/NCETM non-statutory KS3 guidance, and Oak’s Year 8 units on estimation and rounding, sequences, graphical representations of linear equations, solving linear equations, and geometrical properties: polygons. Decimal arithmetic revisits earlier learning. Topic placement can vary between schools.</p><p>All questions here are original. No endorsement by the Department for Education, NCETM, Oak National Academy or an examination board is claimed. Foundation, Core and Challenge are application difficulty labels.</p><h3>Source references (internet needed only to visit these links)</h3><ul><li><a href="https://www.gov.uk/government/publications/national-curriculum-in-england-mathematics-programmes-of-study" target="_blank" rel="noopener">DfE mathematics programmes of study</a></li><li><a href="https://www.gov.uk/government/publications/teaching-mathematics-at-key-stage-3" target="_blank" rel="noopener">DfE teaching mathematics at Key Stage 3</a></li><li><a href="https://www.ncetm.org.uk/classroom-resources/dfe-guidance-on-teaching-maths-at-ks3/" target="_blank" rel="noopener">NCETM KS3 guidance</a></li><li><a href="https://www.thenational.academy/teachers/programmes/maths-secondary/units?years=8" target="_blank" rel="noopener">Oak Year 8 mathematics unit sequence</a></li></ul><h3>Privacy and answer visibility</h3><p>No personal information is requested or transmitted. Saved responses can be erased on Home. A browser may restrict local storage for local files. Answers are stored separately from question records and are not rendered before submission, except for deliberately worked teaching examples. Because this is a self-contained offline file, its JavaScript and answer logic can be inspected: it cannot provide secure examination conditions.</p><h3>Feedback bands</h3><p>85–100%: Secure and ready for further challenge. 70–84%: Mostly secure. 50–69%: Developing. Below 50%: More guided practice recommended. Thresholds use the unrounded percentage.</p></section>`);}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{capture();({home,learn,mocks,alignment})[b.dataset.nav]();});
window.addEventListener('beforeunload',capture);
// Deterministic structural checks run before the application opens.
function audit(){
 const seen=new Set();Object.values(Q).forEach(q=>{if(seen.has(q.text))throw Error('Duplicate question');seen.add(q.text);if(!K[q.id]||!K[q.id].steps.length||q.fields.length+1!==q.marks)throw Error('Incomplete scheme');if(!matches(ansText(K[q.id].answer),K[q.id].answer))throw Error('Answer parser mismatch '+q.id);});
 names.forEach((_,t)=>{if(practice[t].length!==14)throw Error('Bank count');for(let l=0;l<3;l++)if(practice[t].filter(id=>!Q[id].diagnostic&&Q[id].l===l).length!==4)throw Error('Level count');});
 Object.keys(configs).forEach(k=>{if(mockSets[k].reduce((s,id)=>s+Q[id].marks,0)!==configs[k].total)throw Error('Mark total');if(new Set(mockSets[k].map(id=>Q[id].t)).size!==7)throw Error('Topic coverage');});
}
try{audit();home();if(state.session&&!state.session.ended&&state.session.deadline){tick();timerHandle=setInterval(tick,1000);}}catch(e){show('<section><h2>Application check failed</h2><p>'+esc(e.message)+'</p></section>');console.error(e);}
</script>
</body>
</html>
